name: CI Pipeline

# Quand est-ce que ce workflow se déclenche ?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code depuis le dépôt
    - name: Checkout du code
      uses: actions/checkout@v4

    # 2. Installer Python sur la machine GitHub
    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Bonne pratique : accélère les futurs builds

    # 3. Installer les dépendances
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Lancer les tests !
    - name: Exécution des tests avec Pytest
      run: |
        pytest

    # 5. Tester la construction de l'image Docker
    - name: Build de l'image Docker
      run: |
        docker build -t mon-api-hello-world .